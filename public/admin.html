<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store administration | Island Basket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css"><script src="/admin.js" defer></script>
</head>
<body class="admin-page">
  <header class="admin-header"><div class="header-main wrap"><a class="brand" href="/"><span class="brand-mark">✳</span><span>island<span class="brand-accent">basket</span><small>STORE ADMINISTRATION</small></span></a><a href="/" class="text-link">← Back to shop</a></div></header>
  <main class="admin-main">
    <div id="login-view" class="admin-card admin-login"><span class="section-kicker">WELCOME BACK</span><h1>Store sign in<span class="heading-dot">.</span></h1><p class="fine-print">Enter the administrator password configured on your server.</p><form id="login-form"><label>Password<input type="password" name="password" required autocomplete="current-password"></label><p class="form-error hidden" id="login-error" role="alert"></p><button class="button button-dark full-width" type="submit">Sign in →</button></form></div>
    <div id="dashboard" class="hidden"><div class="admin-toolbar"><div><span class="section-kicker">YOUR STORE</span><h1>Good morning, admin<span class="heading-dot">.</span></h1></div><button id="logout" class="filter-button">Sign out</button></div><div class="admin-tabs"><button id="orders-tab" class="active">Orders</button><button id="products-tab">Products</button></div><p id="admin-error" class="form-error hidden" role="alert"></p>
      <section id="orders-panel" class="admin-card"><div class="admin-toolbar"><h2>Customer orders</h2><button class="filter-button" id="refresh-orders">Refresh</button></div><div id="orders-list"></div></section>
      <section id="products-panel" class="admin-card hidden"><div class="admin-toolbar"><h2>Products</h2><button class="button button-dark" id="add-product">+ Add product</button></div><div id="admin-products" class="admin-list"></div></section>
    </div>
  </main>
  <dialog id="product-form-dialog"><div class="dialog-head"><div><span class="section-kicker">YOUR CATALOGUE</span><h2 id="product-form-title">Add product</h2></div><button class="icon-button" id="close-product-form" aria-label="Close">✕</button></div>
    <form id="product-form"><input type="hidden" name="id"><div class="admin-form-grid">
      <label>Name<input name="name" required maxlength="120"></label><label>Category<input name="category" required maxlength="80"></label>
      <label>Unit<input name="unit" required maxlength="80" placeholder="e.g. 1 kg"></label><label>Stock quantity<input name="stock" type="number" min="0" max="100000" step="1" required></label>
      <label>Price (MVR)<input name="price" type="number" min="0" max="1000000" step="0.01" required></label><label>Original price (MVR, optional)<input name="original_price" type="number" min="0" max="1000000" step="0.01"></label>
      <label class="wide">Image URL (HTTPS)<input name="image" type="url" required maxlength="1000"></label>
      <label class="wide">Description<textarea name="description" rows="3" required maxlength="1000"></textarea></label>
      <label class="checkbox-label wide"><input name="featured" type="checkbox"> Feature this product</label>
    </div><p id="product-error" class="form-error hidden" role="alert"></p><button type="submit" class="button button-dark full-width">Save product</button></form>
  </dialog>
</body>
</html>
